[build]
  command = "npm run production"
  publish = "dist"

[[redirects]]
  from = "https://dgs-web.netlify.app/*"
  to = "https://www.delgrossos.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy/"
  to = "https://www.iubenda.com/privacy-policy/35923895"
  status = 302
  force = true
